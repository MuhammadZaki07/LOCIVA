name: Deploy Backend to InfinityFree

on:
  push:
    branches:
      # - main
      - yusron
    paths:
      - "back-end/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, json, bcmath, fileinfo, pdo, pdo_mysql
          tools: composer

      - name: Install Composer dependencies
        working-directory: ./back-end
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Deploy backend
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_BACKEND_USERNAME }}
          password: ${{ secrets.FTP_BACKEND_PASS }}
          local-dir: ./back-end/
          server-dir: /lociva.freedev.app/htdocs/
          exclude: |
            **/.env
            **/.htaccess

